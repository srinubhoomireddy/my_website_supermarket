<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarket Order Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Supermarket Order Manager</h1>
      <p>Simple browser-based sales and stock management</p>
    </div>
    <button id="resetDataBtn" class="btn btn-danger">Reset Demo Data</button>
  </header>

  <main class="container">
    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="products">Products</button>
      <button class="tab" data-tab="new-order">New Order</button>
      <button class="tab" data-tab="orders">Orders</button>
    </nav>

    <section id="dashboard" class="tab-content active">
      <div class="cards">
        <div class="card"><span>Total Products</span><strong id="statProducts">0</strong></div>
        <div class="card"><span>Stock Units</span><strong id="statStock">0</strong></div>
        <div class="card"><span>Total Orders</span><strong id="statOrders">0</strong></div>
        <div class="card"><span>Total Sales</span><strong id="statSales">₹0.00</strong></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Low Stock</h2><span class="muted">10 units or less</span></div>
        <div id="lowStockList" class="table-wrap"></div>
      </div>
    </section>

    <section id="products" class="tab-content">
      <div class="panel">
        <div class="panel-head">
          <h2>Product Management</h2>
          <button id="addProductBtn" class="btn btn-primary">+ Add Product</button>
        </div>
        <input id="productSearch" class="search" type="search" placeholder="Search by product name or category...">
        <div id="productTable" class="table-wrap"></div>
      </div>
    </section>

    <section id="new-order" class="tab-content">
      <div class="order-layout">
        <div class="panel">
          <div class="panel-head"><h2>Create Order</h2></div>
          <input id="orderSearch" class="search" type="search" placeholder="Search products...">
          <div id="orderProducts" class="product-grid"></div>
        </div>

        <div class="panel cart-panel">
          <div class="panel-head"><h2>Cart</h2><button id="clearCartBtn" class="btn btn-light">Clear</button></div>
          <div id="cartItems"></div>
          <div class="totals">
            <div><span>Subtotal</span><strong id="cartSubtotal">₹0.00</strong></div>
            <div><span>Tax (5%)</span><strong id="cartTax">₹0.00</strong></div>
            <div class="grand"><span>Total</span><strong id="cartTotal">₹0.00</strong></div>
          </div>
          <button id="placeOrderBtn" class="btn btn-success full">Place Order</button>
        </div>
      </div>
    </section>

    <section id="orders" class="tab-content">
      <div class="panel">
        <div class="panel-head">
          <h2>Order History</h2>
          <input id="orderHistorySearch" class="search small-search" type="search" placeholder="Search order...">
        </div>
        <div id="orderTable" class="table-wrap"></div>
      </div>
    </section>
  </main>

  <div id="productModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Add Product</h2>
        <button id="closeModal" class="icon-btn">×</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="productId">
        <label>Product Name<input id="productName" required maxlength="80"></label>
        <label>Category<input id="productCategory" required maxlength="40"></label>
        <div class="form-row">
          <label>Price (₹)<input id="productPrice" type="number" min="0" step="0.01" required></label>
          <label>Stock<input id="productStock" type="number" min="0" step="1" required></label>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelModal" class="btn btn-light">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
